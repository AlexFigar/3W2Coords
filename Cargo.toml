[package]
name = "three_words_to_coords"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "3W2Coords"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
indicatif = "0.17"
console = "0.15"
